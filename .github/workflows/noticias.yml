name: Noticias
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer titulares
        run: node scripts/noticias.mjs noticias.json
      - name: Guardar si hay cambios
        run: |
          git config user.name "nexus-bot"
          git config user.email "bot@users.noreply.github.com"
          git add noticias.json || true
          git commit -m "Noticias" || echo "sin cambios"
          git pull --rebase || true
          git push || true
